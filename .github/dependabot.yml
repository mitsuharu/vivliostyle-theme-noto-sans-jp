# Dependabot による依存パッケージの自動更新
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'
    groups:
      vivliostyle:
        patterns:
          - '@vivliostyle/*'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 10
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
