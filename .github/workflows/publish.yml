# npm への公開と GitHub Release の作成を行う
#
# 次のどちらかで実行できる
#   1. バージョンのタグ（例: 0.4.0）を push する
#   2. Actions からこのワークフローを手動実行する（バージョンを入力する）
#
# どちらの場合も package.json の version と一致していることを確認してから公開する

name: Publish to npm and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'package.json のバージョン（例: 0.4.0）'
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-to-npm-and-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # リポジトリをチェックアウト
      # タグ push のときはそのタグ、手動実行のときは main を対象にする
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      # Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      # 公開するバージョンが package.json と一致しているかを確認する
      - name: Validate release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_VERSION="$REF_NAME"
          else
            RELEASE_VERSION="$INPUT_VERSION"
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be a valid SemVer version: $RELEASE_VERSION" >&2
            exit 1
          fi

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version $RELEASE_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

          TAG="$PACKAGE_VERSION"
          HEAD_COMMIT=$(git rev-parse HEAD)
          TAG_EXISTS=false
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG already points to $TAG_COMMIT instead of commit $HEAD_COMMIT" >&2
              exit 1
            fi
            TAG_EXISTS=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

      # 依存パッケージをインストールする
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      # 公開前にテーマが壊れていないかを確認する
      - name: Verify package
        run: |
          yarn check
          yarn validate
          yarn pdf
          npm pack --dry-run

      # 同じバージョンがすでに npm に公開されていないかを確認する
      - name: Check npm registry
        id: npm
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version >/dev/null 2>&1; then
            if [ "${{ steps.release.outputs.tag_exists }}" != "true" ]; then
              echo "$PACKAGE_NAME@$RELEASE_VERSION is already published, but tag $RELEASE_VERSION does not exist" >&2
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # タグがなければ作成して push する（手動実行のとき）
      - name: Create and push tag
        if: steps.release.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git tag -a "$RELEASE_TAG" -m "Release version $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      # npm に公開する
      - name: Publish to npm
        if: steps.npm.outputs.already_published != 'true'
        run: npm publish --access public --provenance

      # GitHub Release を作成する
      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
